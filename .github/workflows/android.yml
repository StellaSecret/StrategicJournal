name: Build Strategic Journal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1 : Lint & Tests ──────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle & generate wrapper
        working-directory: android
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
          gradle wrapper --gradle-version "8.9"
          chmod +x gradlew

      - name: Run lint
        working-directory: android
        run: ./gradlew lint

      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDevDebugUnitTest

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results*.html
          if-no-files-found: ignore

  # ── JOB 2 : Build ─────────────────────────────────────
  build:
    name: Build AAB (Play Store) + APK (sideload)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle & generate wrapper
        working-directory: android
        run: |
          wget -q "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
          gradle wrapper --gradle-version "8.9"
          chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > $GITHUB_WORKSPACE/strategic-journal-release.jks

      - name: Set versionCode
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ github.run_number }}/" \
            android/app/build.gradle.kts
          echo "versionCode → ${{ github.run_number }}"
          grep versionCode android/app/build.gradle.kts

      - name: Build AAB release (signé)
        working-directory: android
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
          KEYSTORE_PATH: ${{ github.workspace }}/strategic-journal-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleProdRelease --no-daemon

      - name: Build APK release (signé)
        working-directory: android
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
          KEYSTORE_PATH: ${{ github.workspace }}/strategic-journal-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/prodRelease/app-prod-release.aab \
             dist/strategic-journal-${{ github.run_number }}.aab
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk \
             dist/strategic-journal-${{ github.run_number }}.apk
          cp android/app/build/outputs/mapping/prodRelease/mapping.txt \
             dist/mapping-${{ github.run_number }}.txt 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.run_number }}
          path: dist/
          retention-days: 7

      - name: Clean up keystore
        if: always()
        run: rm -f ${{ github.workspace }}/strategic-journal-release.jks

  # ── JOB 3 : Release ───────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-${{ github.run_number }}
          path: dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Strategic Journal build #${{ github.run_number }}"
          body: |
            Build #${{ github.run_number }}

            📦 **strategic-journal-${{ github.run_number }}.aab** → Upload sur Play Store
            📱 **strategic-journal-${{ github.run_number }}.apk** → Installation directe (tests)
          files: |
            dist/strategic-journal-${{ github.run_number }}.aab
            dist/strategic-journal-${{ github.run_number }}.apk
            dist/mapping-${{ github.run_number }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
